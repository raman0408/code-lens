[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-lens"
version = "0.1.0"
description = "Deterministic analysis of performance-relevant changes between Python versions."
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4"]

[project.scripts]
code-lens = "code_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
